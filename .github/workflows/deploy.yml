# Publishes Rumi to GitHub Pages (HTTPS is needed for install, offline mode and the password lock).
# Repo → Settings → Pages → Source: "GitHub Actions".
# Data commits (data/**) made by the app's cloud sync do NOT trigger a redeploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the app files (never the data folder)
        run: |
          mkdir site
          cp index.html styles.css app.js db.js jalali.js security.js sync.js sw.js manifest.webmanifest *.png icon.svg site/
          mkdir site/fonts && cp fonts/Barbra-High.ttf site/fonts/
          touch site/.nojekyll
          # New version id on every deploy, so installed apps notice the update and reload into it
          sed -i "s/var CACHE = 'rumi-shell-[^']*'/var CACHE = 'rumi-${GITHUB_SHA::12}'/" site/sw.js
          grep -n "var CACHE" site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
